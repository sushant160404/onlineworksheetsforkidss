<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filters for Crisp Pop -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <filter id="pencil-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Circular Outer Red Border -->
  <circle cx="256" cy="256" r="242" fill="#FFFFFF" stroke="#DC2626" stroke-width="26" />

  <!-- Top "ONLINE" Badge -->
  <g transform="translate(0, 52)">
    <!-- Cyan pill background -->
    <rect x="136" y="24" width="240" height="76" rx="38" fill="#E0F2FE" />
    <!-- Yellow and Green festive sparks around ONLINE -->
    <path d="M 104 52 Q 88 56 100 68" stroke="#10B981" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 120 32 Q 106 24 116 12" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 408 52 Q 424 56 412 68" stroke="#10B981" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 392 32 Q 406 24 396 12" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- ONLINE Text -->
    <text x="256" y="78" text-anchor="middle" font-family="'Fredoka', 'Quicksand', 'Arial Rounded MT Bold', system-ui, sans-serif" font-weight="900" font-size="52" fill="#0284C7" letter-spacing="3">ONLINE</text>
  </g>

  <!-- "WORKSHEETS" Arched Text -->
  <g transform="translate(0, 206)">
    <text x="256" y="0" text-anchor="middle" font-family="'Fredoka', 'Arial Rounded MT Bold', 'Impact', sans-serif" font-weight="900" font-size="64" fill="#DC2626" letter-spacing="-1" filter="url(#soft-shadow)">WORKSHEETS</text>
  </g>

  <!-- "for" with dashes -->
  <g transform="translate(0, 252)">
    <!-- Sparks -->
    <path d="M 172 0 Q 158 8 168 18" stroke="#0284C7" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 180 -18 Q 166 -16 172 -28" stroke="#10B981" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 188 -32 Q 198 -42 210 -34" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" fill="none" />

    <text x="256" y="0" text-anchor="middle" font-family="'Fredoka', 'Quicksand', 'Comic Sans MS', cursive, sans-serif" font-weight="900" font-style="italic" font-size="44" fill="#1E3A8A">for</text>

    <path d="M 340 0 Q 354 8 344 18" stroke="#0284C7" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 332 -18 Q 346 -16 340 -28" stroke="#10B981" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 324 -32 Q 314 -42 302 -34" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- "KIDSS" Big Playful Bold Letters -->
  <g transform="translate(0, 326)">
    <text x="256" y="0" text-anchor="middle" font-family="'Fredoka', 'Arial Rounded MT Bold', 'Impact', sans-serif" font-weight="900" font-size="82" fill="#DC2626" letter-spacing="1" filter="url(#soft-shadow)">KIDSS</text>
  </g>

  <!-- Decorative Sparks around Worksheet & Pencil -->
  <g>
    <!-- Left sparks -->
    <path d="M 150 368 Q 134 374 148 388" stroke="#10B981" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 140 404 Q 120 406 142 418" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 158 438 Q 146 452 164 454" stroke="#0284C7" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Right sparks -->
    <path d="M 362 368 Q 378 374 364 388" stroke="#10B981" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 372 404 Q 392 406 370 418" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 354 438 Q 366 452 348 454" stroke="#0284C7" stroke-width="7" stroke-linecap="round" fill="none" />
  </g>

  <!-- Worksheet Notepad Illustration -->
  <g transform="translate(196, 348) rotate(-4)" filter="url(#soft-shadow)">
    <!-- Back page tilt shadow -->
    <rect x="-3" y="-3" width="82" height="106" rx="10" fill="#BAE6FD" />
    <!-- Main page -->
    <rect x="0" y="0" width="82" height="106" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="5" />
    <!-- Yellow star on sheet -->
    <path d="M 22 14 L 25 22 L 34 23 L 27 29 L 29 38 L 22 33 L 15 38 L 17 29 L 10 23 L 19 22 Z" fill="#F59E0B" stroke="#D97706" stroke-width="1.5" />
    <!-- Ruled lines -->
    <line x1="38" y1="20" x2="68" y2="20" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" />
    <line x1="38" y1="32" x2="68" y2="32" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" />
    <line x1="16" y1="46" x2="68" y2="46" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" />
    <line x1="16" y1="60" x2="68" y2="60" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" />
    <line x1="16" y1="74" x2="68" y2="74" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" />
    <line x1="16" y1="88" x2="52" y2="88" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Cute Pencil Illustration (Slanted) -->
  <g transform="translate(290, 420) rotate(-35)" filter="url(#pencil-shadow)">
    <!-- Eraser (Pink) -->
    <rect x="-11" y="-48" width="22" height="18" rx="5" fill="#F43F5E" stroke="#E11D48" stroke-width="2.5" />
    <!-- Metal Ferrule (Silver/Blue-Gray) -->
    <rect x="-11" y="-30" width="22" height="10" fill="#CBD5E1" stroke="#64748B" stroke-width="2" />
    <line x1="-11" y1="-25" x2="11" y2="-25" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Yellow Wooden Pencil Body -->
    <rect x="-11" y="-20" width="22" height="46" fill="#FBBF24" stroke="#D97706" stroke-width="2.5" />
    <line x1="-3" y1="-20" x2="-3" y2="26" stroke="#F59E0B" stroke-width="2" />
    <line x1="4" y1="-20" x2="4" y2="26" stroke="#FEF08A" stroke-width="2" />
    <!-- Sharpened Tip (Wood) -->
    <polygon points="-11,26 11,26 0,44" fill="#FED7AA" stroke="#D97706" stroke-width="2" />
    <!-- Graphite Lead Tip (Dark Gray) -->
    <polygon points="-5,36 5,36 0,46" fill="#1E293B" />
  </g>
</svg>
